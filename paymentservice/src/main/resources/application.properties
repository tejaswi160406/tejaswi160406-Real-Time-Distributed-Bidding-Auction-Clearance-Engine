spring.application.name=paymentservice
server.port=1619

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/bidvelocity_payment
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Downstream services (Eureka logical name, load balanced) ----------
bidvelocity.clients.auction-service=http://auctionservice

# ---------- JWT ----------
bidvelocity.jwt.secret=BidVelocityAuctionEngineSuperSecretSigningKey2026

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info