spring.application.name=auctionservice
server.port=1616

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/bidvelocity_auction
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Auction rules ----------
bidvelocity.auction.sweep-interval-ms=2000
bidvelocity.auction.anti-snipe-window-seconds=30
bidvelocity.auction.anti-snipe-extension-seconds=30
# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------- JWT ----------
bidvelocity.jwt.secret=BidVelocityAuctionEngineSuperSecretSigningKey2026

management.endpoints.web.exposure.include=health,info